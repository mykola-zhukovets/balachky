# Балачки — конфігурація.
# Скопіюй цей файл у config.toml і зміни під себе. Будь-яке поле можна опустити —
# візьметься дефолт із whisper_core/config.py. config.toml у .gitignore (особистий).

model_name   = "large-v3-turbo" # "large-v3-turbo" (~2x швидше, рекомендовано) | "large-v3" (трохи точніше, повільніше)
compute_type = "int8"         # int8 | int8_float32 | float32
language     = "uk"           # мова розпізнавання: "auto" (визначати) | код Whisper ("uk", "en", "de", "pl"… ~99 мов)
beam_size    = 5
model_idle_unload_seconds = 600  # 10 хв бездіяльності → звільнити STT/Gemma з RAM/VRAM; 0 = ніколи
log_level    = "INFO"      # INFO | DEBUG | WARNING; routine-лог у %LOCALAPPDATA%\Balachky\logs
meeting_encrypt = false     # opt-in AES-GCM encryption for completed meeting artifacts

ptt_key      = "ctrl+shift+space"  # push-to-talk: клавіша або комбінація (утримання; змінюється у вікні Налаштувань)
hotkey_backend = "native"     # механізм глобальних хоткеїв: "native" (WinAPI RegisterHotKey, без хука клавіатури — рекомендовано) | "legacy" (стара бібліотека keyboard; аварійний відкат, якщо native десь не спрацює)
ptt_mode     = "hold"         # hold (утримання) | toggle (натиснув-почав / натиснув-зупинив) | double_tap (подвійний тап — старт, одинарний — стоп; hands-free)
double_tap_ms = 400           # вікно між двома тапами для старту у режимі double_tap (мс, 200..600)

# Переглянути й відредагувати текст у картці перед вставкою (керується у Налаштуваннях).
paste_preview = false         # true — після розпізнавання показати картку «Вставити / Копіювати / Скасувати»

# note_hotkey  = "ctrl+shift+n"  # необовʼязкова комбінація, що відкриває плаваючу нотатку (порожньо = вимкнено; пункт трею «Нотатка» є завжди)

# Чутливість VAD (для досвідчених; керується у Налаштуваннях). Діє з наступної транскрипції.
vad_threshold      = 0.5      # поріг мовлення Silero 0.1..0.9 (нижче — чутливіше до тихої мови)
vad_min_silence_ms = 500      # мінімальна пауза (мс), після якої сегмент закривається
vad_min_speech_ms  = 250      # найкоротша тривалість мови (мс); коротші сплески відкидаються

# Аудіо-центр (feature/audio-center; керується у Налаштуваннях → «Звук»).
# output_device — пристрій відтворення для перевірки мікрофона (за замовч. — системний).
# output_device = "Динаміки (Realtek)"

# Обробка перед розпізнаванням — обидва opt-in, вимкнені за замовчуванням. Це прості
# «немодельні» методи (RMS-гейт і лінійний нормалізатор), безпечні для Whisper. НЕ
# додавай сюди ML-шумозаглушення — воно погіршує розпізнавання (див. дослідження).
noise_gate_enabled      = false  # шумовий гейт: ріже тишу/шум між словами
noise_gate_threshold_db = -45.0  # поріг гейта у dBFS (нижче — рамка вважається тишею)
agc_enabled             = false  # автогучність: вирівнює гучність тихого мікрофона
agc_target_db           = -20.0  # цільовий RMS-рівень AGC у dBFS

# Пакет зручностей диктування (усі — opt-in / безпечні дефолти; керуються у Налаштуваннях).
undo_paste_key                = ""       # хоткей «Скасувати останню вставку»; "" = вимкнено (трей-пункт завжди є)
insert_last_key               = ""       # хоткей «Вставити останнє ще раз»; "" = вимкнено (трей-пункт завжди є)
dictation_autostop_silence_s  = 0        # автостоп диктування після N с тиші; 0 = вимкнено (1..30)
dictation_max_duration_s      = 1200     # ліміт тривалості диктування (с); 0 = без ліміту; 1200 = 20 хв
paste_confirm_sound           = false    # звук підтвердження після вдалої вставки
quiet_hours_enabled           = false    # «тихі години»: у проміжок нижче — жодних звуків
quiet_hours_start             = "22:00"  # початок «тихих годин» (HH:MM)
quiet_hours_end               = "07:00"  # кінець «тихих годин» (HH:MM)

# Позиція плаваючого індикатора диктування (пише сам застосунок після перетягування).
# Не задано → типова позиція (низ по центру основного екрана). Якщо збережена позиція
# опиниться поза всіма моніторами (монітор від'єднали) — теж типова.
# pill_x = 860
# pill_y = 980

# recordings_dir = "D:/Балачки/записи"  # тека записів диктофона (опустити → локальна
                                        # підпапка recordings у даних застосунку)

# Правка розшифровки прямо в застосунку (кнопка «Редагувати» на картках Файлів і
# Нарад). true → правка перезаписує збережений текст (final у пам'яті / transcript.txt
# сесії); повторний експорт бере вже виправлений текст. Пошук по тексту (Ctrl+F)
# доступний завжди. Типово вимкнено (opt-in), бо правка змінює збережений результат.
transcript_editing_enabled = false

# Автозбереження нотаток (керується у Налаштуваннях). Кожна завершена розшифровка
# дописується у файл дня "balachky-РРРР-ММ-ДД" у вибраній папці — можна вказати
# папку всередині свого сховища Obsidian.
auto_export_enabled = false   # true — вмикає автозбереження (потрібна ще й папка)
auto_export_dir     = ""      # шлях до папки автозбереження ("" — вимкнено)
auto_export_format  = "md"    # "md" (Markdown) | "txt" (простий текст)

# Жива «розшифровка» під час запису (навантажує CPU; фінальна після stop точніша).
live_transcription = false

# Розрізнення співрозмовників у системній доріжці наради (потрібне окреме завантаження моделей).
diarization_enabled = false
# diarization_num_speakers = 2  # порожньо/відсутнє = визначити автоматично

# Режим «Нарада»: запис екрана вимкнено, доки його явно не ввімкнуть у вкладці.
meeting_screen_enabled = false
meeting_screen_fps = 12       # 10–15 fps достатньо для наради
meeting_screen_monitor = 1    # фізичні монітори mss нумерує з 1
